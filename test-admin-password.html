<!DOCTYPE html>
<html>
<head>
    <title>Test Admin Password</title>
</head>
<body>
    <h1>Testing Admin Password</h1>
    <button onclick="testPassword()">Test Password</button>
    <pre id="result"></pre>
    
    <script>
        async function testPassword() {
            const response = await fetch('http://localhost:5001/api/admin/auth/test-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: 'ralvarez@soilseedandwater.com',
                    password: 'admin123'
                })
            });
            
            const data = await response.json();
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            console.log('Password test result:', data);
        }
        
        // Auto-run on load
        testPassword();
    </script>
</body>
</html>
