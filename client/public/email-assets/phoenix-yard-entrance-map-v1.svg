<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Organic Soil Wholesale Phoenix yard entrance map</title>
  <desc id="desc">Enter from the Grand Avenue south gate, follow the yard lane north, turn left toward check-in and loading, and exit from the north gate.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17261a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f6b45"/>
    </marker>
    <pattern id="parking" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(8)">
      <path d="M0 0V42" stroke="#b9ad98" stroke-width="2" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#f6f1e6"/>

  <!-- Grand Avenue and railroad -->
  <path d="M-80,-20 L225,-20 L970,820 L640,820 Z" fill="#626663"/>
  <path d="M170,-20 L945,820" stroke="#f4b94e" stroke-width="10" opacity="0.9"/>
  <path d="M125,-20 L900,820" stroke="#f5f1e7" stroke-width="4" stroke-dasharray="34 24" opacity="0.9"/>
  <path d="M-145,130 L565,840" stroke="#4a4d4b" stroke-width="22"/>
  <path d="M-125,110 L585,820" stroke="#ded5c7" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="92" y="188" transform="rotate(47 92 188)" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="1">GRAND AVENUE</text>
  <text x="44" y="265" transform="rotate(47 44 265)" fill="#e8e3da" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">PHOENIX–WICKENBURG HWY</text>
  <text x="18" y="640" transform="rotate(47 18 640)" fill="#5a584f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">RAILROAD</text>

  <!-- Yard -->
  <path d="M225,0 H1200 V800 H970 Z" fill="#e9dfcc"/>
  <path d="M305,72 H1165 V745 H930 Z" fill="#ded2bd" stroke="#b49b72" stroke-width="4"/>
  <path d="M390,125 H1120 V700 H900 Z" fill="url(#parking)" opacity="0.75"/>

  <!-- Buildings and zones -->
  <rect x="845" y="350" width="185" height="295" rx="8" fill="#f8f6ef" stroke="#264027" stroke-width="5" filter="url(#shadow)"/>
  <rect x="865" y="385" width="145" height="82" rx="5" fill="#dbe7d8"/>
  <text x="937" y="418" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">SOIL SEED &amp; WATER</text>
  <text x="937" y="444" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800">OFFICE</text>
  <text x="937" y="505" text-anchor="middle" fill="#5b655b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">CHECK-IN</text>

  <rect x="560" y="210" width="290" height="155" rx="10" fill="#ffffff" stroke="#264027" stroke-width="5" filter="url(#shadow)"/>
  <rect x="585" y="235" width="240" height="42" rx="6" fill="#264027"/>
  <text x="705" y="263" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="0.35">ORGANIC SOIL WHOLESALE</text>
  <text x="705" y="313" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">PICKUP &amp; LOADING</text>
  <text x="705" y="340" text-anchor="middle" fill="#6d654f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Stop here after check-in</text>

  <rect x="1015" y="595" width="150" height="120" rx="8" fill="#c9c4b8" stroke="#817a6d" stroke-width="3"/>
  <text x="1090" y="645" text-anchor="middle" fill="#4d4a43" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">AGAVE</text>
  <text x="1090" y="668" text-anchor="middle" fill="#4d4a43" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">ENVIRONMENTAL</text>

  <!-- Route -->
  <path d="M906,760 C870,725 832,690 820,635 L775,430 C763,385 720,376 677,381 C620,386 580,350 560,302 C544,263 505,220 445,185 C409,164 380,151 350,145" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M906,760 C870,725 832,690 820,635 L775,430 C763,385 720,376 677,381 C620,386 580,350 560,302 C544,263 505,220 445,185 C409,164 380,151 350,145" fill="none" stroke="#2f6b45" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <circle cx="816" cy="606" r="18" fill="#b38a58" stroke="#ffffff" stroke-width="5"/>
  <rect x="1038" y="475" width="125" height="62" rx="9" fill="#ffffff" stroke="#264027" stroke-width="2" opacity="0.96"/>
  <text x="1100" y="500" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">1. FOLLOW THE</text>
  <text x="1100" y="522" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800">YARD LANE</text>
  <text x="720" y="415" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800">2. TURN LEFT</text>

  <!-- Entry pin and label -->
  <g filter="url(#shadow)">
    <path d="M920 728 C920 693 872 693 872 728 C872 752 896 776 896 776 C896 776 920 752 920 728 Z" fill="#b38a58" stroke="#ffffff" stroke-width="5"/>
    <circle cx="896" cy="728" r="8" fill="#ffffff"/>
  </g>
  <rect x="750" y="650" width="260" height="63" rx="12" fill="#ffffff" stroke="#b38a58" stroke-width="3" filter="url(#shadow)"/>
  <text x="880" y="677" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900">ENTER HERE</text>
  <text x="880" y="700" text-anchor="middle" fill="#6a604c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Grand Ave south gate</text>

  <!-- Exit label -->
  <rect x="235" y="96" width="190" height="58" rx="10" fill="#ffffff" stroke="#264027" stroke-width="3" filter="url(#shadow)"/>
  <text x="330" y="121" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900">EXIT TO GRAND AVE</text>
  <text x="330" y="142" text-anchor="middle" fill="#6a604c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">north gate</text>

  <!-- Header and coordinate card -->
  <rect x="690" y="24" width="474" height="134" rx="18" fill="#ffffff" stroke="#264027" stroke-width="4" filter="url(#shadow)"/>
  <text x="927" y="58" text-anchor="middle" fill="#b38a58" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="2">PHOENIX YARD PICKUP</text>
  <text x="927" y="91" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">Enter from Grand Avenue</text>
  <text x="927" y="121" text-anchor="middle" fill="#4f584f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">1634 N 19th Ave · Phoenix, AZ 85009</text>
  <text x="927" y="145" text-anchor="middle" fill="#6f6757" font-family="Arial, Helvetica, sans-serif" font-size="14">Entrance pin: 33.467333, -112.101250</text>

  <g transform="translate(1090 185)">
    <path d="M0 42 L0 0" stroke="#264027" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="0" y="65" text-anchor="middle" fill="#264027" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900">NORTH</text>
  </g>
  <text x="1148" y="780" text-anchor="end" fill="#756e60" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">DIAGRAM · NOT TO SCALE</text>
</svg>
